<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#fff"/>
<text x="700" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#14213d">Clover-K3 Distributed Inference Architecture</text>
<text x="700" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334e68">Sequential per token • Concurrent across tokens • Layer-local resources</text>
<rect x="35" y="105" width="210" height="250" rx="14" fill="#eef7ff" stroke="#8ec5ff" stroke-width="2"/>
<text x="140" y="140" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#17365d">Client</text>
<text x="140" y="168" text-anchor="middle" font-family="Arial" font-size="16" fill="#17365d">Token ↔ Vector</text>
<text x="60" y="215" font-family="Arial" font-size="16">Token IDs</text><text x="60" y="242" font-family="Arial" font-size="16">↓ embedding</text><text x="60" y="269" font-family="Arial" font-size="16">7,168-vector</text><text x="60" y="296" font-family="Arial" font-size="16">representation</text>
<text x="60" y="330" font-family="Arial" font-size="14" fill="#52606d">≈2.35 GB embedding table</text>
<rect x="270" y="105" width="260" height="250" rx="14" fill="#eefaf1" stroke="#75c98a" stroke-width="2"/>
<text x="400" y="140" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#164b2b">Server Pipeline</text>
<text x="400" y="168" text-anchor="middle" font-family="Arial" font-size="16" fill="#164b2b">Layer 0</text>
<text x="295" y="210" font-family="Arial" font-size="15">Initial transformation</text><text x="295" y="238" font-family="Arial" font-size="15">Routing preparation</text><text x="295" y="266" font-family="Arial" font-size="15">Cache / scheduling</text><text x="295" y="294" font-family="Arial" font-size="15">Send runtime state → L1</text>
<text x="295" y="330" font-family="Arial" font-size="14" fill="#52606d">Dense • no expert store</text>
<rect x="555" y="105" width="810" height="250" rx="14" fill="#fff5f8" stroke="#f09ab2" stroke-width="2"/>
<text x="960" y="140" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#6b1730">Layer Pods 1–92</text>
<g font-family="Arial" font-size="15" text-anchor="middle">
<rect x="580" y="175" width="160" height="145" rx="10" fill="#fff" stroke="#8ec5ff"/><text x="660" y="200" font-weight="700">Layer 1 Pod</text><text x="660" y="228">MLA / KDA</text><text x="660" y="253">Router → top-16</text><text x="660" y="278">Local experts</text><text x="660" y="303">Output vector</text>
<rect x="775" y="175" width="160" height="145" rx="10" fill="#fff" stroke="#8ec5ff"/><text x="855" y="200" font-weight="700">Layer 2 Pod</text><text x="855" y="228">MLA / KDA</text><text x="855" y="253">Router → top-16</text><text x="855" y="278">Local experts</text><text x="855" y="303">Output vector</text>
<rect x="970" y="175" width="160" height="145" rx="10" fill="#fff" stroke="#8ec5ff"/><text x="1050" y="200" font-weight="700">Layer 3 Pod</text><text x="1050" y="228">MLA / KDA</text><text x="1050" y="253">Router → top-16</text><text x="1050" y="278">Local experts</text><text x="1050" y="303">Output vector</text>
<text x="1180" y="255" font-size="30">…</text>
<rect x="1205" y="175" width="135" height="145" rx="10" fill="#fff" stroke="#8ec5ff"/><text x="1272" y="200" font-weight="700">Layer 92</text><text x="1272" y="228">MLA / KDA</text><text x="1272" y="253">Router</text><text x="1272" y="278">Experts</text><text x="1272" y="303">Output</text>
</g>
<g stroke="#3b82f6" stroke-width="3" fill="none"><path d="M245 230 H270"/><path d="M530 230 H580"/><path d="M740 230 H775"/><path d="M935 230 H970"/><path d="M1130 230 H1205"/><path d="M1340 230 H1365"/></g>
<rect x="35" y="390" width="1330" height="180" rx="14" fill="#f7fafc" stroke="#bcccdc" stroke-width="2"/>
<text x="60" y="425" font-family="Arial" font-size="22" font-weight="700" fill="#243b53">Pipeline concurrency</text>
<text x="60" y="451" font-family="Arial" font-size="14" fill="#52606d">Per-token dependency is sequential; different tokens can occupy different layers simultaneously.</text>
<g font-family="Arial" font-size="14">
<text x="60" y="485">Token A</text><rect x="150" y="468" width="120" height="34" rx="6" fill="#bde0fe"/><text x="210" y="490" text-anchor="middle">L0</text><rect x="275" y="468" width="120" height="34" rx="6" fill="#bde0fe"/><text x="335" y="490" text-anchor="middle">L1</text><rect x="400" y="468" width="120" height="34" rx="6" fill="#bde0fe"/><text x="460" y="490" text-anchor="middle">L2</text><rect x="525" y="468" width="120" height="34" rx="6" fill="#bde0fe"/><text x="585" y="490" text-anchor="middle">L3</text>
<text x="60" y="530">Token B</text><rect x="275" y="512" width="120" height="34" rx="6" fill="#cdeccf"/><text x="335" y="534" text-anchor="middle">L0</text><rect x="400" y="512" width="120" height="34" rx="6" fill="#cdeccf"/><text x="460" y="534" text-anchor="middle">L1</text><rect x="525" y="512" width="120" height="34" rx="6" fill="#cdeccf"/><text x="585" y="534" text-anchor="middle">L2</text><rect x="650" y="512" width="120" height="34" rx="6" fill="#cdeccf"/><text x="710" y="534" text-anchor="middle">L3</text>
</g>
<rect x="850" y="430" width="490" height="115" rx="10" fill="#fff9db" stroke="#e6c75a"/>
<text x="875" y="457" font-family="Arial" font-size="15" font-weight="700">Key architectural property</text>
<text x="875" y="483" font-family="Arial" font-size="14">One layer owns its trunk + 896 experts.</text>
<text x="875" y="507" font-family="Arial" font-size="14">Runtime state moves between layers.</text>
<text x="875" y="531" font-family="Arial" font-size="14">A constrained layer can scale independently.</text>
<g font-family="Arial" font-size="14">
<rect x="35" y="605" width="300" height="145" rx="12" fill="#eef7ff" stroke="#8ec5ff"/><text x="55" y="635" font-size="18" font-weight="700">Layer resource boundary</text><text x="55" y="665">≈15.77 GB expert store</text><text x="55" y="690">≈423–635 MB trunk</text><text x="55" y="715">Local storage + runtime memory</text>
<rect x="365" y="605" width="300" height="145" rx="12" fill="#f6f0ff" stroke="#b69cff"/><text x="385" y="635" font-size="18" font-weight="700">Communication</text><text x="385" y="665">Runtime state, not weights</text><text x="385" y="690">5 positions ≈70.53 MB</text><text x="385" y="715">Internal low-latency AI fabric</text>
<rect x="695" y="605" width="300" height="145" rx="12" fill="#eefaf1" stroke="#75c98a"/><text x="715" y="635" font-size="18" font-weight="700">Scaling</text><text x="715" y="665">Client / server / layer are separate</text><text x="715" y="690">Replicate only constrained layers</text><text x="715" y="715">Measure before claiming throughput</text>
<rect x="1025" y="605" width="340" height="145" rx="12" fill="#fff5f8" stroke="#f09ab2"/><text x="1045" y="635" font-size="18" font-weight="700">Model-wide structure</text><text x="1045" y="665">92 MoE layers × 896 experts</text><text x="1045" y="690">82,432 experts ≈1.45 TB</text><text x="1045" y="715">Partitioned ownership, not reduced data</text>
</g>
</svg>