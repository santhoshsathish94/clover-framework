<!DOCTYPE html>
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clover</title>
<meta name="theme-color" content="#faf8f2">
<style>
:root {
  --bg:           #faf8f2;
  --soft:         #f2eee4;
  --soft-2:       #e7e1d3;
  --surface:      #fffefb;
  --glass:        rgba(250, 248, 242, 0.92);
  --ink:          #132018;
  --ink-2:        #2d3e34;
  --muted:        #596a5f;
  --line:         #dfd8c8;
  --line-2:       #c9c0ad;
  --accent:       #1b5e46;
  --accent-hover: #124331;
  --accent-soft:  #e3efe8;
  --accent-tint:  #eef6f1;
  --accent-line:  #8bb7a4;
  --serif:        "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font:         "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:         "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-xs:    8px;
  --radius-sm:    12px;
  --radius:       16px;
  --radius-pill:  999px;
  --shadow-xs:    0 1px 3px rgba(18, 32, 24, 0.05);
  --shadow-sm:    0 6px 20px -4px rgba(18, 32, 24, 0.07);
  --shadow-lg:    0 20px 48px -10px rgba(18, 32, 24, 0.18);
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body.clover-app-body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body.clover-app-body {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
}

.clover-sprite { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }
.clover__leaf.is-filled { fill: var(--accent); stroke: var(--accent); stroke-width: 1.8; }
.clover__stem { fill: none; stroke: var(--accent-line); stroke-width: 3.4; stroke-linecap: round; }

.clover-app {
  flex: 1; min-height: 0;
  display: flex; width: 100%; height: 100%;
  overflow: hidden; background: var(--bg); position: relative;
}

/* Sidebar */
.clover-sidebar-backdrop { display: none; }
.clover-sidebar-backdrop.is-open {
  display: block; position: fixed; inset: 0; z-index: 95;
  background: rgba(19, 32, 24, 0.36); backdrop-filter: blur(2px);
}
.clover-sidebar {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
  width: min(272px, 82vw);
  background: var(--soft);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
  transform: translateX(-105%);
  transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}
.clover-sidebar.is-mobile-open {
  transform: translateX(0);
  box-shadow: var(--shadow-lg);
  pointer-events: auto;
}
.clover-sidebar__top {
  padding: 0.85rem 0.9rem;
  border-bottom: 1px solid var(--line);
}
.clover-model-badge {
  width: 100%; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: var(--radius-pill);
  padding: 0.5rem 0.85rem; font-size: 0.86rem; font-weight: 650;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-xs);
}
.clover-model-badge span:last-child {
  font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
  padding: 0.1rem 0.45rem; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line);
}
.clover-sidebar__label-row {
  padding: 0.65rem 0.85rem 0.3rem 0.95rem;
  display: flex; align-items: center; justify-content: space-between;
}
.clover-sidebar__label-text {
  font-size: 0.72rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.clover-sessions-plus-btn {
  width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--accent); font-size: 1.1rem; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.clover-session-list {
  flex: 1; min-height: 0; overflow-y: auto; padding: 0.35rem 0.55rem 0.8rem;
  display: flex; flex-direction: column; gap: 0.22rem;
}
.clover-session-row {
  display: flex; align-items: center; gap: 0.25rem;
  border-radius: var(--radius-xs); border: 1px solid transparent; padding: 0.14rem 0.25rem 0.14rem 0.35rem;
}
.clover-session-row.is-active { background: var(--surface); border-color: var(--accent-line); box-shadow: var(--shadow-xs); }
.clover-session-select {
  flex: 1; min-width: 0; text-align: left; background: transparent; border: 0;
  padding: 0.42rem 0.35rem; font: inherit; font-size: 0.87rem; color: var(--ink-2);
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.clover-session-row.is-active .clover-session-select { color: var(--accent-hover); font-weight: 650; }
.clover-session-del {
  width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent;
  color: var(--muted); font-size: 0.98rem; font-weight: 650; cursor: pointer;
}

/* Main Area */
.clover-main {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column; background: var(--bg);
}
.clover-topbar {
  padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line);
  background: var(--glass); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between;
}
.clover-topbar__left { display: flex; align-items: center; gap: 0.58rem; }
.clover-sidebar-toggle {
  width: 34px; height: 34px; border-radius: var(--radius-xs);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.clover-topbar__brand {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-family: var(--serif); font-weight: 600; font-size: 1.06rem; color: var(--ink);
}
.clover-topbar__brand svg { width: 22px; height: 22px; }

/* Stream */
.clover-stream {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 1rem 0.85rem 0.75rem;
  display: flex; flex-direction: column; align-items: center;
}
.clover-stream__inner {
  width: min(780px, 100%);
  display: flex; flex-direction: column; gap: 1rem;
}
.k3-msg {
  max-width: 92%; padding: 0.85rem 1.05rem; border-radius: var(--radius);
  line-height: 1.6; font-size: 0.95rem; word-wrap: break-word;
}
.k3-msg p { margin: 0 0 0.55rem 0; color: inherit; }
.k3-msg p:last-child { margin-bottom: 0; }
.k3-msg code {
  font-family: var(--mono); font-size: 0.86em;
  background: var(--soft); padding: 0.1rem 0.32rem; border-radius: 5px;
}
.k3-msg--user {
  align-self: flex-end; background: var(--accent); color: #fff;
  border-bottom-right-radius: 4px; box-shadow: var(--shadow-xs);
}
.k3-msg--user strong { color: #fff; }
.k3-msg--bot {
  align-self: flex-start; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-bottom-left-radius: 4px; box-shadow: var(--shadow-xs);
}
.k3-bot-turn {
  align-self: flex-start; display: flex; flex-direction: column;
  align-items: flex-start; max-width: 92%; width: auto;
}
.k3-bot-turn > .k3-msg { max-width: 100%; }

.k3-figure {
  margin: 0.55rem 0 0.2rem; padding: 0.45rem; background: var(--soft);
  border: 1px solid var(--line-2); border-radius: var(--radius-sm); text-align: center;
}
.k3-figure svg, .k3-figure img { max-width: 100%; height: auto; border-radius: 7px; display: block; margin: 0 auto; }
.k3-audio-player { display: block; width: 100%; max-width: 300px; height: 38px; margin: 0.4rem auto 0.1rem; }

.k3-below-actions {
  margin-top: 0.24rem; padding-left: 0.18rem;
  display: flex; align-items: center; gap: 0.22rem; color: var(--muted);
}
.k3-icon-action {
  width: 28px; height: 28px; border-radius: 6px; border: 0;
  background: transparent; color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.k3-icon-action svg { width: 15px; height: 15px; }

@keyframes clover-dot-slow {
  0%, 20%  { opacity: 0.22; transform: translateY(0); }
  50%      { opacity: 1; transform: translateY(-1.5px); }
  80%, 100%{ opacity: 0.22; transform: translateY(0); }
}
.clover-dots-loader {
  display: inline-flex; align-items: center; gap: 0.18rem;
  font-size: 1.3rem; font-weight: 700; line-height: 1; color: var(--ink-2);
  padding: 0.05rem 0.2rem; letter-spacing: 0.08em;
}
.clover-dots-loader span { display: inline-block; animation: clover-dot-slow 1.8s ease-in-out infinite; }
.clover-dots-loader span:nth-child(2) { animation-delay: 0.3s; }
.clover-dots-loader span:nth-child(3) { animation-delay: 0.6s; }
.clover-dots-loader span:nth-child(4) { animation-delay: 0.9s; }

/* Composer with Output Type Tabs Directly Above the Message Box */
.clover-composer-wrap {
  flex: 0 0 auto; width: 100%;
  padding: 0.45rem 0.75rem calc(0.65rem + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line); background: var(--bg);
  display: flex; flex-direction: column; align-items: center;
}
.clover-composer-outer {
  width: min(780px, 100%);
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.38rem;
}
.clover-output-tabs {
  display: inline-flex; align-items: center; gap: 0.22rem;
  padding: 0.18rem; border-radius: 999px;
  background: var(--soft); border: 1px solid var(--line);
}
.clover-output-tab {
  background: transparent; color: var(--ink-2); border: 1px solid transparent;
  border-radius: 999px; padding: 0.24rem 0.72rem; font: inherit; font-size: 0.78rem;
  font-weight: 650; cursor: pointer; line-height: 1.2;
}
.clover-output-tab.is-active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

.clover-composer-card {
  width: 100%; background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 16px;
  padding: 0.42rem 0.55rem; box-shadow: var(--shadow-sm);
}
.k3-preview-bar {
  padding: 0.36rem 0.55rem; margin-bottom: 0.35rem;
  background: var(--accent-soft); border: 1px solid var(--accent-line);
  border-radius: 9px; display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem; font-size: 0.78rem; color: var(--ink);
}
.k3-preview-bar__info { display: flex; align-items: center; gap: 0.45rem; overflow: hidden; }
.k3-preview-bar img { width: 28px; height: 28px; object-fit: cover; border-radius: 5px; }
.k3-preview-bar button {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px;
  padding: 0.18rem 0.48rem; font-size: 0.74rem; font-weight: 600; cursor: pointer;
}

.clover-composer-row { display: flex; align-items: flex-end; gap: 0.42rem; }
.clover-composer-row textarea {
  flex: 1; min-width: 0; background: transparent; color: var(--ink); border: 0;
  padding: 0.42rem 0.32rem; font: inherit; font-size: 0.96rem; resize: none;
  min-height: 36px; max-height: 120px; line-height: 1.42;
}
.clover-composer-row textarea:focus { outline: none; }
.clover-composer-btn {
  width: 36px; height: 36px; flex: 0 0 36px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--soft); color: var(--ink-2);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.clover-send-btn {
  height: 36px; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--accent); color: #fff; font: inherit; font-size: 0.85rem;
  font-weight: 650; padding: 0 0.82rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.35rem;
}
.clover-send-icon { width: 18px; height: 18px; display: block; }
.clover-send-icon__stem { fill: none; stroke: rgba(255,255,255,0.8); stroke-width: 4; stroke-linecap: round; }
.clover-send-icon__leaf { fill: #fff; stroke: #fff; stroke-width: 1.8; }
@keyframes clover-leaf-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.clover-send-icon__wheel { transform-origin: 50px 44px; animation: clover-leaf-spin 9s linear infinite; }
</style>
</head>
<body class="clover-app-body">

<svg class="clover-sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <path id="clover-leaf" d="M50 44C48 35 38 31 38 21C38 12 46 9 50 17C54 9 62 12 62 21C62 31 52 35 50 44Z"/>
  </defs>
</svg>

<main id="main" class="clover-app">
  <div class="clover-sidebar-backdrop" id="clover-sidebar-backdrop" onclick="k3CloseMobileSidebar()"></div>
  <aside class="clover-sidebar" id="clover-sidebar" aria-label="Chat sessions">
    <div class="clover-sidebar__top">
      <div class="clover-model-badge">
        <span>Liquid LFM3-Omni</span>
        <span>On-Device</span>
      </div>
    </div>
    <div class="clover-sidebar__label-row">
      <span class="clover-sidebar__label-text">Sessions</span>
      <button type="button" class="clover-sessions-plus-btn" onclick="k3ResetChat()" title="New chat">+</button>
    </div>
    <div class="clover-session-list" id="k3-session-list"></div>
  </aside>

  <section class="clover-main">
    <div class="clover-topbar">
      <div class="clover-topbar__left">
        <button type="button" class="clover-sidebar-toggle" onclick="k3ToggleSidebar()" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <span class="clover-topbar__brand">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="clover__stem" d="M50 48C50 68 50 80 50 95"/>
            <use class="clover__leaf is-filled" href="#clover-leaf"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(72 50 44)"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(144 50 44)"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(216 50 44)"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(288 50 44)"/>
          </svg>
          Clover
        </span>
      </div>
    </div>

    <div class="clover-stream" id="clover-stream-scroller">
      <div class="clover-stream__inner" id="k3-chat-log" aria-live="polite">
        <div class="k3-msg k3-msg--bot">
          <p>Hi I am Clover, How can I help you today?</p>
        </div>
      </div>
    </div>

    <div class="clover-composer-wrap">
      <div class="clover-composer-outer">
        <div class="clover-output-tabs" id="k3-output-tabs" role="tablist" aria-label="Output type">
          <button type="button" class="clover-output-tab is-active" data-output-type="text" onclick="k3OnOutputTypeChanged('text')">Text</button>
          <button type="button" class="clover-output-tab" data-output-type="image" onclick="k3OnOutputTypeChanged('image')">Image</button>
          <button type="button" class="clover-output-tab" data-output-type="video" onclick="k3OnOutputTypeChanged('video')">Video</button>
          <button type="button" class="clover-output-tab" data-output-type="audio" onclick="k3OnOutputTypeChanged('audio')">Audio</button>
        </div>
        <div class="clover-composer-card">
          <div class="k3-preview-bar" id="k3-img-preview-bar" hidden>
            <div class="k3-preview-bar__info">
              <img id="k3-img-preview-thumb" src="" alt="Preview" hidden>
              <span id="k3-img-preview-name">Attachment ready</span>
            </div>
            <button type="button" onclick="k3ClearAttachments()">Remove</button>
          </div>
          <div class="clover-composer-row">
            <input type="file" id="k3-file-input" multiple hidden onchange="k3OnFilesSelected(event)">
            <button type="button" class="clover-composer-btn" id="k3-attach-btn" onclick="k3TriggerFileAttach()" title="Attach files">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
              </svg>
            </button>
            <textarea id="k3-prompt-in" rows="1" placeholder="Message Clover..."></textarea>
            <button type="button" class="clover-composer-btn" id="k3-voice-btn" onclick="k3ToggleVoice()" title="Voice input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <button type="button" class="clover-send-btn" id="k3-send-btn" onclick="k3SendPrompt()">
              <svg class="clover-send-icon" viewBox="0 0 100 100" aria-hidden="true">
                <path class="clover-send-icon__stem" d="M50 48C50 68 50 80 50 95"/>
                <g class="clover-send-icon__wheel">
                  <use class="clover-send-icon__leaf" href="#clover-leaf"/>
                  <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(72 50 44)"/>
                  <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(144 50 44)"/>
                  <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(216 50 44)"/>
                  <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(288 50 44)"/>
                </g>
              </svg>
              <span>Send</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  var STORAGE_SESSIONS_KEY = 'clover_s23_omni_sessions_v2';
  var selectedOutputType = 'text';
  var attachedImageB64 = null;
  var attachedFiles = [];
  var wasVoiceInput = false;

  var sessions = { currentId: '', order: [], map: {} };
  function loadSessions() {
    try {
      var raw = localStorage.getItem(STORAGE_SESSIONS_KEY);
      if (raw) sessions = JSON.parse(raw);
    } catch (e) {}
    if (!sessions.currentId || !sessions.map[sessions.currentId]) {
      var id = 'sess_' + Date.now();
      sessions = { currentId: id, order: [id], map: {} };
      sessions.map[id] = { id: id, title: 'New chat', messages: [] };
      saveSessions();
    }
    renderSessionList();
    renderChatLog();
  }
  function saveSessions() {
    try { localStorage.setItem(STORAGE_SESSIONS_KEY, JSON.stringify(sessions)); } catch (e) {}
  }
  function renderSessionList() {
    var listEl = document.getElementById('k3-session-list');
    listEl.innerHTML = '';
    sessions.order.forEach(function (id) {
      var s = sessions.map[id];
      if (!s) return;
      var row = document.createElement('div');
      row.className = 'clover-session-row' + (id === sessions.currentId ? ' is-active' : '');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'clover-session-select';
      btn.textContent = s.title || 'New chat';
      btn.onclick = function () {
        sessions.currentId = id;
        saveSessions();
        renderSessionList();
        renderChatLog();
        k3CloseMobileSidebar();
      };
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'clover-session-del';
      del.innerHTML = '&times;';
      del.onclick = function (ev) {
        ev.stopPropagation();
        delete sessions.map[id];
        sessions.order = sessions.order.filter(function (x) { return x !== id; });
        if (!sessions.order.length) {
          var nid = 'sess_' + Date.now();
          sessions.map[nid] = { id: nid, title: 'New chat', messages: [] };
          sessions.order = [nid];
          sessions.currentId = nid;
        } else if (sessions.currentId === id) {
          sessions.currentId = sessions.order[0];
        }
        saveSessions();
        renderSessionList();
        renderChatLog();
      };
      row.appendChild(btn);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  }
  function renderChatLog() {
    var logEl = document.getElementById('k3-chat-log');
    var cur = sessions.map[sessions.currentId];
    if (!cur || !cur.messages || !cur.messages.length) {
      logEl.innerHTML = '<div class="k3-msg k3-msg--bot"><p>Hi I am Clover, How can I help you today?</p></div>';
      return;
    }
    logEl.innerHTML = '';
    cur.messages.forEach(function (m) {
      var div = document.createElement('div');
      div.className = m.role === 'user' ? 'k3-msg k3-msg--user' : 'k3-bot-turn';
      div.innerHTML = m.html;
      logEl.appendChild(div);
    });
    var scroller = document.getElementById('clover-stream-scroller');
    scroller.scrollTop = scroller.scrollHeight;
  }

  window.k3ResetChat = function () {
    var id = 'sess_' + Date.now();
    sessions.map[id] = { id: id, title: 'New chat', messages: [] };
    sessions.order.unshift(id);
    sessions.currentId = id;
    saveSessions();
    renderSessionList();
    renderChatLog();
    k3CloseMobileSidebar();
  };

  window.k3ToggleSidebar = function () {
    var sb = document.getElementById('clover-sidebar');
    var bd = document.getElementById('clover-sidebar-backdrop');
    var open = !sb.classList.contains('is-mobile-open');
    if (open) {
      sb.classList.add('is-mobile-open');
      bd.classList.add('is-open');
    } else {
      k3CloseMobileSidebar();
    }
  };
  window.k3CloseMobileSidebar = function () {
    document.getElementById('clover-sidebar').classList.remove('is-mobile-open');
    document.getElementById('clover-sidebar-backdrop').classList.remove('is-open');
  };

  window.k3OnOutputTypeChanged = function (outType) {
    selectedOutputType = outType;
    var tabs = document.querySelectorAll('.clover-output-tab');
    tabs.forEach(function (t) {
      if (t.getAttribute('data-output-type') === outType) t.classList.add('is-active');
      else t.classList.remove('is-active');
    });
  };

  window.k3TriggerFileAttach = function () {
    if (window.CloverAndroidBridge && window.CloverAndroidBridge.requestOsPermission) {
      window.CloverAndroidBridge.requestOsPermission('files');
    }
    document.getElementById('k3-file-input').click();
  };

  window.k3OnFilesSelected = function (ev) {
    var files = ev.target.files;
    if (!files || !files.length) return;
    Array.prototype.forEach.call(files, function (f) {
      var reader = new FileReader();
      var mime = (f.type || '').toLowerCase();
      if (mime.indexOf('image/') === 0) {
        reader.onload = function (e) {
          attachedImageB64 = e.target.result;
          attachedFiles.push({ name: f.name, type: f.type, content_text: '', data_b64: e.target.result });
          updateAttachmentBar();
        };
        reader.readAsDataURL(f);
      } else if (mime.indexOf('text/') === 0 || /\.(py|js|ts|json|md|txt|c|cpp|h|rs|sh|html|css|xml|csv)$/i.test(f.name)) {
        reader.onload = function (e) {
          attachedFiles.push({ name: f.name, type: f.type || 'text/plain', content_text: String(e.target.result || ''), data_b64: '' });
          updateAttachmentBar();
        };
        reader.readAsText(f);
      } else {
        reader.onload = function (e) {
          attachedFiles.push({ name: f.name, type: f.type || 'application/octet-stream', content_text: '', data_b64: String(e.target.result || '') });
          updateAttachmentBar();
        };
        reader.readAsDataURL(f);
      }
    });
  };

  function updateAttachmentBar() {
    var bar = document.getElementById('k3-img-preview-bar');
    var thumb = document.getElementById('k3-img-preview-thumb');
    var nameEl = document.getElementById('k3-img-preview-name');
    if (!attachedImageB64 && !attachedFiles.length) {
      bar.hidden = true;
      return;
    }
    bar.hidden = false;
    if (attachedImageB64) {
      thumb.src = attachedImageB64;
      thumb.hidden = false;
    } else {
      thumb.hidden = true;
    }
    nameEl.textContent = attachedFiles.map(function (x) { return x.name; }).join(', ') || 'Image attached';
  }

  window.k3ClearAttachments = function () {
    attachedImageB64 = null;
    attachedFiles = [];
    document.getElementById('k3-file-input').value = '';
    updateAttachmentBar();
  };

  window.k3ToggleVoice = function () {
    if (window.CloverAndroidBridge && window.CloverAndroidBridge.startNativeVoiceRecognition) {
      window.CloverAndroidBridge.startNativeVoiceRecognition();
      return;
    }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      var rec = new SR();
      rec.lang = 'en-US';
      rec.onresult = function (e) {
        window.k3OnNativeVoiceResult(e.results[0][0].transcript);
      };
      rec.start();
    }
  };

  window.k3OnNativeVoiceResult = function (spokenText) {
    var inp = document.getElementById('k3-prompt-in');
    inp.value = (inp.value ? inp.value + ' ' : '') + spokenText;
    wasVoiceInput = true;
    window.k3SendPrompt();
  };

  function formatMarkdownReply(text) {
    var safe = String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    var lines = safe.split('\n');
    var out = [];
    lines.forEach(function (ln) {
      var t = ln.trim();
      if (!t) return;
      out.push('<p>' + t + '</p>');
    });
    return out.join('') || '<p>Done.</p>';
  }

  window.k3SpeakTextBtn = function (btn) {
    var turn = btn.closest('.k3-bot-turn');
    var txt = turn ? turn.innerText : '';
    if (window.CloverAndroidBridge && window.CloverAndroidBridge.speakText) {
      window.CloverAndroidBridge.speakText(txt);
    }
  };

  window.k3CopyTextBtn = function (btn) {
    var turn = btn.closest('.k3-bot-turn');
    var txt = turn ? turn.innerText : '';
    if (window.CloverAndroidBridge && window.CloverAndroidBridge.copyToClipboard) {
      window.CloverAndroidBridge.copyToClipboard(txt);
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(txt);
    }
  };

  function callS23EngineAsync(method, endpoint, payloadObj, cb) {
    setTimeout(function () {
      try {
        if (window.CloverAndroidBridge && window.CloverAndroidBridge.callLocalS23Api) {
          var raw = window.CloverAndroidBridge.callLocalS23Api(
            method,
            endpoint,
            payloadObj ? JSON.stringify(payloadObj) : null
          );
          cb(null, JSON.parse(raw));
        } else {
          cb(new Error('CloverAndroidBridge required'), null);
        }
      } catch (ex) {
        cb(ex, null);
      }
    }, 20);
  }

  window.k3SendPrompt = function () {
    var inp = document.getElementById('k3-prompt-in');
    var prompt = String(inp.value || '').trim();
    if (!prompt && !attachedImageB64 && !attachedFiles.length) return;
    if (!prompt) prompt = 'Describe the attached file.';
    inp.value = '';

    var reqOutType = selectedOutputType;
    window.k3OnOutputTypeChanged('text');

    var curSess = sessions.map[sessions.currentId];
    if (curSess && (!curSess.messages || !curSess.messages.length)) {
      curSess.title = prompt.slice(0, 34);
    }

    var userHtml = '<p>' + prompt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p>';
    curSess.messages.push({ role: 'user', text: prompt, html: userHtml });
    saveSessions();
    renderSessionList();
    renderChatLog();

    var logEl = document.getElementById('k3-chat-log');
    var loaderDiv = document.createElement('div');
    loaderDiv.className = 'k3-bot-turn';
    loaderDiv.innerHTML =
      '<div class="k3-msg k3-msg--bot"><div class="clover-dots-loader" role="status" aria-label="Loading"><span>.</span><span>.</span><span>.</span><span>.</span></div></div>';
    logEl.appendChild(loaderDiv);
    var scroller = document.getElementById('clover-stream-scroller');
    scroller.scrollTop = scroller.scrollHeight;

    var payload = {
      prompt: prompt,
      model: 'lfm3-1.7b',
      output_type: reqOutType,
      image_b64: attachedImageB64,
      attached_files: attachedFiles,
      voice_input: wasVoiceInput
    };
    var speakAfter = wasVoiceInput || reqOutType === 'audio';
    wasVoiceInput = false;
    window.k3ClearAttachments();

    callS23EngineAsync('POST', '/api/chat', payload, function (err, res) {
      if (err || !res || res.error) {
        loaderDiv.innerHTML = '<div class="k3-msg k3-msg--bot"><p>Please wait a moment while the local LFM3-Omni model finishes starting up.</p></div>';
        return;
      }

      var bodyHtml = formatMarkdownReply(res.reply);

      var actionsHtml =
        '<div class="k3-below-actions">' +
          '<button type="button" class="k3-icon-action" onclick="k3SpeakTextBtn(this)" title="Listen">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>' +
          '</button>' +
          '<button type="button" class="k3-icon-action" onclick="k3CopyTextBtn(this)" title="Copy">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
          '</button>' +
        '</div>';

      var finalBotHtml = '<div class="k3-msg k3-msg--bot">' + bodyHtml + '</div>' + actionsHtml;
      loaderDiv.innerHTML = finalBotHtml;
      curSess.messages.push({ role: 'bot', text: res.reply, html: finalBotHtml });
      saveSessions();
      scroller.scrollTop = scroller.scrollHeight;

      if (speakAfter && res.reply && window.CloverAndroidBridge && window.CloverAndroidBridge.speakText) {
        window.CloverAndroidBridge.speakText(res.reply);
      }
    });
  };

  document.getElementById('k3-prompt-in').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      window.k3SendPrompt();
    }
  });

  loadSessions();
})();
</script>
</body>
</html>
