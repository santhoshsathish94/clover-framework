<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img"
     aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="title">A React Server Components memory leak, stabilized then traced upstream</title>
  <desc id="desc">Five stages. Context: server memory grew without bound under sustained load. Direction: stabilize the incident with a Node stack-trace flag, then keep investigating past the workaround. Execution: find the cause in React's react-server renderer, where a cleanup Error retains the completed render's cache scope, and contribute a one-file fix upstream as react slash react pull request 37289. Outcome: the fleet soak validated the mitigation rather than the patch, and the pull request is CI-green and not merged. Growth: a repeatable retained-heap harness turned it leaks into a provable before and after, and the layer where a symptom appears was not the layer that owned it.</desc>

  <rect width="960" height="380" fill="#ffffff"/>

  <text x="20" y="26" font-size="12" font-weight="700" fill="#0a6a5f" letter-spacing="1.6">CONTEXT → DIRECTION → EXECUTION → OUTCOME → GROWTH</text>
  <line x1="20" y1="40" x2="940" y2="40" stroke="#d6e2e0" stroke-width="1"/>

  <g stroke="#7fb8b0" stroke-width="1.5" fill="#e6f2f0">
    <rect x="21" y="60" width="210" height="140" rx="10"/>
    <rect x="257" y="60" width="210" height="140" rx="10"/>
    <rect x="493" y="60" width="210" height="140" rx="10"/>
    <rect x="729" y="60" width="210" height="140" rx="10"/>
  </g>

  <g fill="#0a6a5f" font-size="10.5" font-weight="700" letter-spacing="1.3">
    <text x="37" y="84">THE INCIDENT</text>
    <text x="273" y="84">THE MITIGATION</text>
    <text x="509" y="84">THE ROOT CAUSE</text>
    <text x="745" y="84">UPSTREAM</text>
  </g>

  <g fill="#14181d" font-size="13.5" font-weight="700">
    <text x="37" y="106">Memory grew until it died</text>
    <text x="273" y="106">Blunt, and it worked</text>
    <text x="509" y="106">An Error nobody sees</text>
    <text x="745" y="106">One file, +11 / −0</text>
  </g>

  <g fill="#39424d" font-size="12">
    <text x="37" y="128">Server memory grew without</text>
    <text x="37" y="145">bound under sustained load</text>
    <text x="37" y="166">Recurring production</text>
    <text x="37" y="183">incidents, releases delayed</text>

    <text x="273" y="128">NODE_OPTIONS with</text>
    <text x="273" y="145">--stack-trace-limit=0</text>
    <text x="273" y="166">Growth stopped, and stack</text>
    <text x="273" y="183">detail was lost everywhere</text>

    <text x="509" y="128">On every successful render,</text>
    <text x="509" y="145">a cleanup Error is kept</text>
    <text x="509" y="166">Its stack retains the render's</text>
    <text x="509" y="183">cache scope and the fetches</text>

    <text x="745" y="128">Capture the Error with the</text>
    <text x="745" y="145">stack limit at zero, restore</text>
    <text x="745" y="166">ReactFlightServer.js</text>
    <text x="745" y="183">react/react#37289</text>
  </g>

  <g stroke="#0a6a5f" stroke-width="1.5" fill="none">
    <path d="M237 130h14M251 130l-6-4M251 130l-6 4"/>
    <path d="M473 130h14M487 130l-6-4M487 130l-6 4"/>
    <path d="M709 130h14M723 130l-6-4M723 130l-6 4"/>
  </g>

  <path d="M834 200v10M834 210l-4-6M834 210l4 6" stroke="#0a6a5f" stroke-width="1.5" fill="none"/>
  <rect x="21" y="216" width="918" height="62" rx="10" fill="#e6f2f0" stroke="#7fb8b0" stroke-width="1.5"/>
  <text x="37" y="238" font-size="10.5" font-weight="700" fill="#0a6a5f" letter-spacing="1.3">GROWTH · BACK INTO CONTEXT</text>
  <text x="37" y="259" font-size="12" fill="#39424d">A repeatable retained-heap-after-GC harness turned “it leaks” into a provable before and after, and caught a false positive a single run would</text>
  <text x="37" y="271" font-size="12" fill="#39424d">have missed. The layer where a symptom appears is often not the layer that owns it: every report named Next.js, and the defect was in React.</text>

  <rect x="21" y="294" width="918" height="70" rx="10" fill="#f4f7f7" stroke="#d6e2e0" stroke-width="1"/>
  <text x="37" y="316" font-size="11.5" font-weight="700" fill="#0a6a5f" letter-spacing="1.2">WHERE THE WORK STOPPED</text>
  <text x="37" y="336" font-size="12" fill="#39424d">The fleet soak — 113 restarts without the flag, zero with it — validated the mitigation rather than the upstream patch.</text>
  <text x="37" y="354" font-size="12" fill="#39424d">The fix went to React, and the matching Next.js instance is a separate report. <tspan font-weight="700" fill="#14181d">The pull request is CI-green and not merged.</tspan></text>
</svg>
