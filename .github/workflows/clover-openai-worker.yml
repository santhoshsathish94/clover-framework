name: Clover OpenAI Worker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clover-openai-worker
  cancel-in-progress: false

jobs:
  model-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: pip install openai

      - name: Run one OpenAI-backed developmental cycle
        working-directory: AI Manipulation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOVER_MODEL: ${{ vars.CLOVER_MODEL }}
        run: |
          python -c "from supervisor.supervisor import run; from supervisor.openai_backend import OpenAIBackend; run(OpenAIBackend())"

      - name: Commit worker state
        run: |
          git config user.name "Clover OpenAI Worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "AI Manipulation/supervisor/state.json"
          if git diff --cached --quiet; then
            echo "No worker state change."
          else
            git commit -m "AI Manipulation: record OpenAI worker cycle"
            git push
          fi
