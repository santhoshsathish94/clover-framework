name: Clover Development Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: clover-development-engine
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one bounded developmental cycle
        working-directory: AI Manipulation
        run: python development_engine.py

      - name: Commit developmental state
        run: |
          git config user.name "Clover Development Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "AI Manipulation/development_engine_state.json" "AI Manipulation/developmental_memory.json"
          if git diff --cached --quiet; then
            echo "No developmental state change."
          else
            git commit -m "AI Manipulation: record developmental cycle"
            git push
          fi
