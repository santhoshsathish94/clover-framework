name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test documentation validators
        run: python -m unittest discover -s scripts/tests
      - name: Check Markdown links and anchors
        run: python scripts/check-links.py
      - name: Check site before packaging
        run: python scripts/check-site.py
      # Pages must be enabled on the repository (Settings -> Pages -> Source: GitHub Actions).
      # configure-pages cannot enable it: GITHUB_TOKEN has no administration permission.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
