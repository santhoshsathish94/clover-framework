name: Clover AI Manipulation — Provider Independent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clover-ai-manipulation
  cancel-in-progress: false

jobs:
  development-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one provider-independent developmental cycle
        working-directory: AI Manipulation
        run: python unified_development_engine.py

      - name: Commit developmental state
        run: |
          git config user.name "Clover Development Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "AI Manipulation/unified_development_state.json"
          if git diff --cached --quiet; then
            echo "No developmental state change."
          else
            git commit -m "AI Manipulation: record unified developmental cycle"
            git push
          fi
