    display: inline-flex; align-items: center; gap: 0.38rem;

  // ==========================================================================
  // 1. `class_browser_conversation_session_store` (`ConversationSession` -> `Stage1_Context`)
  // ==========================================================================

  class class_browser_conversation_session_store {
    constructor(variable_storage_key) {
      this.variable_storage_key = variable_storage_key;
      this.variable_sessions_by_identifier = {};
      this.variable_ordered_session_identifiers = [];
      this.variable_active_session_identifier = '';
    }

    function_generate_unique_session_identifier() {
      return 'sess_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
    }

    function_save_sessions_to_browser_storage() {
      try {
        var variable_serialized_payload = {
          currentId: this.variable_active_session_identifier,
          order: this.variable_ordered_session_identifiers,
          map: {}
        };
        for (var variable_index = 0; variable_index < this.variable_ordered_session_identifiers.length; variable_index++) {
          var variable_session_id = this.variable_ordered_session_identifiers[variable_index];
          var variable_session_record = this.variable_sessions_by_identifier[variable_session_id];
          if (variable_session_record) {
            variable_serialized_payload.map[variable_session_id] = {
              id: variable_session_id,
              title: variable_session_record.title || 'New chat',
              messages: variable_session_record.messages || []
            };
          }
        }
        localStorage.setItem(this.variable_storage_key, JSON.stringify(variable_serialized_payload));
      } catch (variable_ignored_error) {}
    }

    function_load_sessions_from_browser_storage() {
      try {
        var variable_raw_json_string = localStorage.getItem(this.variable_storage_key);
        if (variable_raw_json_string) {
          var variable_parsed_data = JSON.parse(variable_raw_json_string);
          if (variable_parsed_data && Array.isArray(variable_parsed_data.order) && variable_parsed_data.map) {
            this.variable_sessions_by_identifier = variable_parsed_data.map;
            var variable_self_store = this;
            this.variable_ordered_session_identifiers = variable_parsed_data.order.filter(function (variable_id) {
              return !!variable_self_store.variable_sessions_by_identifier[variable_id];
            });
            this.variable_active_session_identifier =
              variable_parsed_data.currentId && this.variable_sessions_by_identifier[variable_parsed_data.currentId]
                ? variable_parsed_data.currentId
                : this.variable_ordered_session_identifiers[0] || '';
          }
        }
      } catch (variable_ignored_error) {}

      if (
        !this.variable_active_session_identifier ||
        !this.variable_sessions_by_identifier[this.variable_active_session_identifier]
      ) {
        var variable_initial_session_id = this.function_generate_unique_session_identifier();
        this.variable_sessions_by_identifier[variable_initial_session_id] = {
          id: variable_initial_session_id,
          title: 'New chat',
          messages: []
        };
        this.variable_ordered_session_identifiers = [variable_initial_session_id];
        this.variable_active_session_identifier = variable_initial_session_id;
        this.function_save_sessions_to_browser_storage();
      }
    }

    function_get_active_session_record() {
      return this.variable_sessions_by_identifier[this.variable_active_session_identifier] || null;
    }

    function_create_and_activate_new_session() {
      var variable_new_session_id = this.function_generate_unique_session_identifier();
      this.variable_sessions_by_identifier[variable_new_session_id] = {
        id: variable_new_session_id,
        title: 'New chat',
        messages: []
      };
      this.variable_ordered_session_identifiers.unshift(variable_new_session_id);
      this.variable_active_session_identifier = variable_new_session_id;
      this.function_save_sessions_to_browser_storage();
      return variable_new_session_id;
    }

    function_delete_session_by_identifier(variable_target_session_id) {
      if (!variable_target_session_id || !this.variable_sessions_by_identifier[variable_target_session_id]) {
        return false;
      }
      delete this.variable_sessions_by_identifier[variable_target_session_id];
      this.variable_ordered_session_identifiers = this.variable_ordered_session_identifiers.filter(function (
        variable_existing_id
      ) {
        return variable_existing_id !== variable_target_session_id;
      });
      if (!this.variable_ordered_session_identifiers.length) {
        var variable_fallback_session_id = this.function_generate_unique_session_identifier();
        this.variable_sessions_by_identifier[variable_fallback_session_id] = {
          id: variable_fallback_session_id,
          title: 'New chat',
          messages: []
        };
        this.variable_ordered_session_identifiers = [variable_fallback_session_id];
        this.variable_active_session_identifier = variable_fallback_session_id;
      } else if (this.variable_active_session_identifier === variable_target_session_id) {
        this.variable_active_session_identifier = this.variable_ordered_session_identifiers[0];
      }
      this.function_save_sessions_to_browser_storage();
      return true;
    }

    function_extract_prior_conversation_turns(variable_target_session_id, function_convert_html_to_plain_text) {
      var variable_session_record = this.variable_sessions_by_identifier[variable_target_session_id];
      if (!variable_session_record || !Array.isArray(variable_session_record.messages)) {
        return [];
      }
      var variable_completed_turns = [];
      var variable_pending_user_prompt = '';
      for (var variable_index = 0; variable_index < variable_session_record.messages.length; variable_index++) {
        var variable_message_entry = variable_session_record.messages[variable_index];
        var variable_plain_text =
          variable_message_entry.text !== undefined && variable_message_entry.text !== null
            ? String(variable_message_entry.text).trim()
            : function_convert_html_to_plain_text(variable_message_entry.html);
        if (variable_message_entry.role === 'user') {
          variable_pending_user_prompt = variable_plain_text;
        } else if (variable_message_entry.role === 'bot' && variable_pending_user_prompt && variable_plain_text) {
          variable_completed_turns.push({
            user: variable_pending_user_prompt,
            reply: variable_plain_text
          });
          variable_pending_user_prompt = '';
        }
      }
      return variable_completed_turns;
    }
  }

    function_update_attachment_preview_bar() {
      if (!this.variable_preview_bar_element) {
        return;
      }
      var flag_has_no_attachments =
        !this.variable_attached_image_data_url &&
        (!this.variable_attached_files_list || !this.variable_attached_files_list.length);
      if (flag_has_no_attachments) {
        this.variable_preview_bar_element.hidden = true;
        return;
      }
      this.variable_preview_bar_element.hidden = false;
      if (this.variable_preview_thumbnail_element) {
        if (this.variable_attached_image_data_url) {
          this.variable_preview_thumbnail_element.src = this.variable_attached_image_data_url;
          this.variable_preview_thumbnail_element.hidden = false;
        } else {
          this.variable_preview_thumbnail_element.hidden = true;
        }
      }
      if (this.variable_preview_name_element) {
        var variable_attachment_names = [];
        for (var variable_index = 0; variable_index < this.variable_attached_files_list.length; variable_index++) {
          variable_attachment_names.push(this.variable_attached_files_list[variable_index].name);
        }
        this.variable_preview_name_element.textContent = variable_attachment_names.length
          ? variable_attachment_names.join(', ')
          : 'Image attached';
      }
    }

        if (/^\|.+\|$/.test(variable_current_line)) {
          function_close_open_list();
          variable_pending_table_rows.push(variable_current_line);
          continue;
        }
        function_flush_pending_table();
        var variable_code_token_match = variable_current_line.match(/^__K3_CODE_BLOCK_(\d+)__$/);
        if (variable_code_token_match) {
          function_close_open_list();
          var variable_code_index = parseInt(variable_code_token_match[1], 10);
          if (variable_extracted_code_blocks[variable_code_index]) {
            variable_html_parts.push(variable_extracted_code_blocks[variable_code_index]);
          }
          continue;
        }
        var flag_is_bullet_line = /^[•\-*]\s+/.test(variable_current_line);
        var variable_stripped_bullet_line = variable_current_line.replace(/^[•\-*]\s+/, '').trim();
        var flag_has_colon_lead_in =
          /^([^:]{2,75}):\s+(.+)$/.test(variable_stripped_bullet_line) &&
          (variable_line_idx > 0 || variable_non_empty_lines.length > 1) &&
          !/^https?:/i.test(variable_stripped_bullet_line);

        if (flag_is_bullet_line || flag_has_colon_lead_in) {
          if (!flag_is_inside_unordered_list) {
            variable_html_parts.push('<ul>');
            flag_is_inside_unordered_list = true;
          }
          variable_html_parts.push('<li>' + function_format_bold_lead_in(variable_stripped_bullet_line) + '</li>');
        } else {
          function_close_open_list();
          if (
            variable_stripped_bullet_line.slice(-1) === ':' &&
            variable_stripped_bullet_line.split(/\s+/).length <= 10 &&
            variable_line_idx > 0
          ) {
            variable_html_parts.push(
              '<p><strong>' +
                this.function_escape_html_entities(variable_stripped_bullet_line) +
                '</strong></p>'
            );
          } else {
            var variable_sentences = variable_stripped_bullet_line.split(/(?<=[.!?])\s+(?=[A-Z0-9])/);
            if (variable_sentences.length >= 3) {
              for (var variable_s_idx = 0; variable_s_idx < variable_sentences.length; variable_s_idx += 2) {
                var variable_sentence_pair = variable_sentences.slice(variable_s_idx, variable_s_idx + 2).join(' ');
                variable_html_parts.push(
                  '<p>' + this.function_escape_and_linkify_urls(variable_sentence_pair) + '</p>'
                );
              }
            } else {
              variable_html_parts.push(
                '<p>' + this.function_escape_and_linkify_urls(variable_stripped_bullet_line) + '</p>'
              );
            }
          }
        }
      }
      function_close_open_list();
      function_flush_pending_table();
      if (variable_rendered_media_html) {
        if (variable_html_parts.length > 0) {
          variable_html_parts.splice(1, 0, variable_rendered_media_html);
        } else {
          variable_html_parts.push(variable_rendered_media_html);
        }
      }
      return variable_html_parts.join('');
    }
  }

      var variable_message_element = variable_turn_element
        ? variable_turn_element.querySelector('.k3-msg')
        : variable_copy_button && variable_copy_button.closest
          ? variable_copy_button.closest('.k3-msg')
          : null;
      if (!variable_message_element) {
        return;
      }
      var variable_cloned_message = variable_message_element.cloneNode(true);
      var variable_stripped_elements = variable_cloned_message.querySelectorAll(
        '.k3-msg-actions, .k3-copy-code-btn, svg'
      );
      for (var variable_index = 0; variable_index < variable_stripped_elements.length; variable_index++) {
        variable_stripped_elements[variable_index].remove();
      }
      var variable_reply_plain_text = (variable_cloned_message.textContent || '').trim();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(variable_reply_plain_text).then(function () {
          variable_copy_button.classList.add('is-active');
          setTimeout(function () {
            variable_copy_button.classList.remove('is-active');
          }, 1200);
        });
      }
    }

    function_bind_events_and_initialize_studio() {
      var variable_self_coordinator = this;
      this.function_synchronize_sidebar_backdrop();

      window.addEventListener('resize', function () {
        if (
          !variable_self_coordinator.function_check_if_mobile_viewport() &&
          variable_self_coordinator.variable_sidebar_element
        ) {
          variable_self_coordinator.variable_sidebar_element.classList.remove('is-mobile-open');
        }
        variable_self_coordinator.function_synchronize_sidebar_backdrop();
      });

      document.addEventListener('click', function (variable_click_event) {
        if (
          !variable_self_coordinator.function_check_if_mobile_viewport() ||
          !variable_self_coordinator.variable_sidebar_element ||
          !variable_self_coordinator.variable_sidebar_element.classList.contains('is-mobile-open')
        ) {
          return;
        }
        var variable_clicked_target = variable_click_event.target;
        if (!variable_clicked_target) {
          return;
        }
        if (variable_self_coordinator.variable_sidebar_element.contains(variable_clicked_target)) {
          return;
        }
        var variable_toggle_button = document.getElementById('clover-sidebar-toggle');
        if (variable_toggle_button && variable_toggle_button.contains(variable_clicked_target)) {
          return;
        }
        variable_self_coordinator.function_close_mobile_sidebar();
      });

      document.addEventListener('paste', function (variable_paste_event) {
        var variable_clipboard_items =
          (variable_paste_event.clipboardData && variable_paste_event.clipboardData.items) || [];
        for (var variable_index = 0; variable_index < variable_clipboard_items.length; variable_index++) {
          if (
            variable_clipboard_items[variable_index].type &&
            variable_clipboard_items[variable_index].type.indexOf('image/') === 0
          ) {
            var variable_pasted_file = variable_clipboard_items[variable_index].getAsFile();
            if (variable_pasted_file) {
              variable_self_coordinator.variable_attachment_and_speech_codec.function_ingest_selected_files([
                variable_pasted_file
              ]);
            }
          }
        }
      });

      if (this.variable_prompt_input_element) {
        this.variable_prompt_input_element.addEventListener('keydown', function (variable_key_event) {
          if (variable_key_event.key === 'Enter' && !variable_key_event.shiftKey) {
            variable_key_event.preventDefault();
            variable_self_coordinator.function_send_user_prompt_and_render_outcome();
          }
        });
      }

      // Expose HTML inline handler hooks delegating directly to the domain classes
      window.k3CloseMobileSidebar = function () {
        variable_self_coordinator.function_close_mobile_sidebar();
      };
      window.k3ToggleSidebar = function (variable_event) {
        variable_self_coordinator.function_toggle_sidebar_drawer(variable_event);
      };
      window.k3SelectSession = function (variable_session_id) {
        variable_self_coordinator.function_select_session_by_identifier(variable_session_id);
      };
      window.k3DeleteSession = function (variable_session_id) {
        variable_self_coordinator.function_delete_session_and_reset_backend(variable_session_id);
      };
      window.k3ResetChat = function () {
        variable_self_coordinator.function_start_or_reset_chat_session();
      };
      window.k3OnFilesSelected = function (variable_change_event) {
        var variable_files =
          variable_change_event && variable_change_event.target && variable_change_event.target.files
            ? variable_change_event.target.files
            : [];
        variable_self_coordinator.variable_attachment_and_speech_codec.function_ingest_selected_files(
          variable_files
        );
      };
      window.k3ClearAttachments = function () {
        variable_self_coordinator.variable_attachment_and_speech_codec.function_clear_all_attachments();
      };
      window.k3ClearImage = window.k3ClearAttachments;
      window.k3ToggleVoice = function () {
        variable_self_coordinator.variable_attachment_and_speech_codec.function_toggle_voice_recognition();
      };
      window.k3CopyCode = function (variable_button) {
        variable_self_coordinator.function_copy_code_block_to_clipboard(variable_button);
      };
      window.k3SpeakReply = function (variable_button) {
        return variable_self_coordinator.variable_attachment_and_speech_codec.function_speak_assistant_reply(
          variable_button,
          variable_self_coordinator.variable_active_backend_base_url
        );
      };
      window.k3CopyReply = function (variable_button) {
        variable_self_coordinator.function_copy_reply_to_clipboard(variable_button);
      };
      window.k3RegenerateLast = function () {
        variable_self_coordinator.function_regenerate_last_assistant_reply();
      };
      window.k3SendPrompt = function () {
        return variable_self_coordinator.function_send_user_prompt_and_render_outcome();
      };
      window.k3OnModelChanged = function (variable_new_model_key) {
        variable_self_coordinator.function_select_foundation_model_key(variable_new_model_key);
      };

      var variable_saved_model_key = constant_default_model_key;
      try {
        var variable_stored_model = localStorage.getItem(constant_model_storage_key);
        if (variable_stored_model && constant_model_cpu_response_descriptions[variable_stored_model]) {
          variable_saved_model_key = variable_stored_model;
        }
      } catch (variable_ignored_error) {}
      this.function_select_foundation_model_key(variable_saved_model_key);

      this.variable_session_store.function_load_sessions_from_browser_storage();
      this.function_render_session_sidebar_list();
      this.function_render_active_session_messages();
      this.function_probe_healthy_backend_endpoint();
    }
  }

  var variable_studio_coordinator = new class_clover_interactive_studio_coordinator();
  variable_studio_coordinator.function_bind_events_and_initialize_studio();
})();
</script>
