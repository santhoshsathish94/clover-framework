<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clover</title>
<meta name="description" content="Clover — unified 7-layer neuro-symbolic, compiler-verified, memory-accumulating system (93-layer 2.78T MoE, Rust host path, HybridAgent, 11-level parallel NCM, Ontology GraphRAG, Generative Compilation, and Relational Memory Graph).">
<link rel="canonical" href="https://cloverframework.com/clover-ai/">
<meta property="og:title" content="Clover">
<meta property="og:description" content="Interactive Clover system with 256k session context, persistent relational memory graph, ontology-guided reasoning, generative compilation, live web/arXiv search, Python/Rust execution, and multimodal vision.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cloverframework.com/clover-ai/">
<meta property="og:image" content="https://raw.githubusercontent.com/santhoshsathish94/clover-framework/main/assets/branding/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a6a5f">
<link rel="icon" type="image/svg+xml" href="../clover-leaf-favicon.svg">
<link rel="stylesheet" href="../botanical-design-system.css?v=4.1.2">
<style>
  [hidden] { display: none !important; }
  .clover-sidebar { transform: none; transition: margin-left 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
  .clover-topbar__right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .clover-sidebar__top { position: relative; }
  .clover-model-dropdown { position: relative; width: 100%; }
  .clover-model-trigger {
    width: 100%;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-pill);
    padding: 0.52rem 0.85rem;
    font: inherit;
    font-size: 0.86rem;
    font-weight: 650;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    box-shadow: var(--shadow-xs);
    text-align: left;
    transition: border-color 0.18s cubic-bezier(0.22, 1, 0.36, 1), color 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .clover-model-trigger:hover,
  .clover-model-dropdown.is-open .clover-model-trigger {
    border-color: var(--accent);
    color: var(--accent-hover);
    background: var(--accent-tint);
  }
  .clover-model-trigger__name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .clover-model-trigger__chev {
    font-size: 0.78rem;
    color: var(--accent);
    flex-shrink: 0;
    transition: transform 0.18s ease;
  }
  .clover-model-dropdown.is-open .clover-model-trigger__chev {
    transform: rotate(180deg);
  }
  .clover-model-menu {
    position: absolute;
    top: calc(100% + 0.42rem);
    left: 0;
    right: 0;
    z-index: 120;
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 12px;
    box-shadow: 0 12px 28px rgba(19, 32, 24, 0.14);
    padding: 0.38rem;
    display: flex;
    flex-direction: column;
    gap: 0.28rem;
  }
  .clover-model-option {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 9px;
    padding: 0.55rem 0.68rem;
    text-align: left;
    font: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.2rem;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .clover-model-option:hover {
    background: var(--soft);
  }
  .clover-model-option.is-selected {
    background: var(--accent-tint);
    border-color: var(--accent-line);
  }
  .clover-model-option__head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.35rem;
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--ink);
  }
  .clover-model-option.is-selected .clover-model-option__head {
    color: var(--accent-hover);
  }
  .clover-model-option__badge {
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.1rem 0.42rem;
    border-radius: 999px;
    background: var(--soft);
    color: var(--accent);
    border: 1px solid var(--accent-line);
  }
  .clover-model-option__meta {
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--ink-2);
    line-height: 1.35;
  }
  .clover-model-option__speed {
    font-size: 0.72rem;
    font-weight: 650;
    color: var(--warn);
    line-height: 1.35;
  }
  .clover-sidebar__label-row {
    padding: 0.65rem 0.9rem 0.3rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .clover-sidebar__label-text {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .clover-sessions-plus-btn {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 1px solid var(--line-2);
    background: var(--surface);
    color: var(--accent);
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }
  .clover-sessions-plus-btn:hover {
    border-color: var(--accent);
    background: var(--accent-tint);
    color: var(--accent-hover);
  }
  .clover-cpu-pill {
    display: inline-flex; align-items: center; gap: 0.38rem;
    font-size: 0.75rem; font-weight: 650; line-height: 1.2;
    padding: 0.28rem 0.65rem; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line);
    white-space: nowrap;
  }
  .clover-cpu-pill::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: #c48f3b; flex-shrink: 0;
  }
  .clover-modality-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 0.4rem;
    flex-wrap: wrap; padding: 0.12rem 0.25rem 0.42rem; border-bottom: 1px solid var(--rule);
    margin-bottom: 0.2rem;
  }
  .clover-modality-actions {
    display: flex; align-items: center; gap: 0.32rem; flex-wrap: wrap;
  }
  .clover-modality-pill {
    display: inline-flex; align-items: center; gap: 0.28rem;
    padding: 0.2rem 0.54rem; border-radius: 999px; border: 1px solid var(--rule);
    background: var(--bg-soft); color: var(--ink-2); font: inherit; font-size: 0.72rem;
    font-weight: 600; cursor: pointer; transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }
  .clover-modality-pill:hover {
    border-color: var(--accent); background: var(--accent-tint); color: var(--accent-hover);
  }
  .clover-modality-pill.is-active {
    border-color: var(--accent); background: var(--accent-tint); color: var(--accent-hover);
  }
  .clover-modality-pill[hidden] { display: none !important; }
  .clover-modality-status {
    font-size: 0.69rem; font-weight: 600; color: var(--muted); white-space: nowrap;
  }
  .k3-audio-player {
    display: block; width: 100%; max-width: 340px; height: 38px; margin: 0.25rem auto 0.4rem;
  }
  .k3-video-player {
    display: block; width: 100%; max-width: 100%; height: auto; margin: 0 auto; border-radius: 7px; background: #0f172a;
  }
  .k3-dl-group {
    display: inline-flex; align-items: center; gap: 0.35rem; flex-wrap: wrap;
  }
  @media (max-width: 760px) {
    .clover-sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
      width: min(272px, 80vw); flex: 0 0 auto;
      margin-left: 0 !important; transform: translateX(-105%) !important;
      box-shadow: none !important; pointer-events: none;
    }
    .clover-sidebar.is-mobile-open {
      margin-left: 0 !important; transform: translateX(0) !important;
      box-shadow: 0 12px 34px rgba(19, 32, 24, 0.18) !important; pointer-events: auto !important;
    }
    .clover-cpu-pill { font-size: 0.71rem; padding: 0.22rem 0.5rem; }
  }
  @media (max-width: 480px) {
    .clover-cpu-pill { font-size: 0.68rem; padding: 0.2rem 0.45rem; }
  }
</style>
<script>document.documentElement.className = 'js';</script>
</head>
<body class="clover-app-body">
<a class="skip" href="#main">Skip to content</a>

<svg class="clover-sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <path id="clover-leaf" d="M50 44C48 35 38 31 38 21C38 12 46 9 50 17C54 9 62 12 62 21C62 31 52 35 50 44Z"/>
  </defs>
</svg>

<main id="main" class="clover-app" tabindex="-1">
  <div class="clover-sidebar-backdrop" id="clover-sidebar-backdrop" onclick="k3CloseMobileSidebar()"></div>
  <aside class="clover-sidebar" id="clover-sidebar" aria-label="Chat sessions">
    <div class="clover-sidebar__top">
      <div class="clover-model-dropdown" id="clover-model-dropdown">
        <button type="button" class="clover-model-trigger" id="clover-model-trigger" onclick="k3ToggleModelMenu(event)" aria-haspopup="listbox" aria-expanded="false" title="Select foundation model">
          <span class="clover-model-trigger__name" id="clover-model-trigger-label">Nemotron 3.5 Super VL</span>
          <span class="clover-model-trigger__chev" aria-hidden="true">&#9662;</span>
        </button>
        <div class="clover-model-menu" id="clover-model-menu" role="listbox" aria-label="Foundation models" hidden>
          <button type="button" class="clover-model-option is-selected" role="option" aria-selected="true" data-model-key="nemotron-3.5-super-vl" onclick="k3OnModelChanged('nemotron-3.5-super-vl')">
            <div class="clover-model-option__head">
              <span>Nemotron 3.5 Super VL</span>
              <span class="clover-model-option__badge">Default</span>
            </div>
            <div class="clover-model-option__meta">120B-A12B MoE &bull; 131K Vocab</div>
            <div class="clover-model-option__meta">Context: 1M Native Tokens</div>
            <div class="clover-model-option__meta">Modalities: Text, C-RADIO Vision, EVS Video, Audio/Voice &amp; Image/Video Gen</div>
            <div class="clover-model-option__speed">CPU Stage: ~1.1s Clubbed (~2.1s Single)</div>
            <div class="clover-model-option__speed">CPU Response: ~15&ndash;35s Full Turn</div>
          </button>
          <button type="button" class="clover-model-option" role="option" aria-selected="false" data-model-key="lfm3-1.7b" onclick="k3OnModelChanged('lfm3-1.7b')">
            <div class="clover-model-option__head">
              <span>Liquid LFM3-1.7B</span>
              <span class="clover-model-option__badge">Compact</span>
            </div>
            <div class="clover-model-option__meta">24-Layer Tri-Hybrid &bull; 128K Vocab</div>
            <div class="clover-model-option__meta">Context: 1M Session (256K Native)</div>
            <div class="clover-model-option__meta">Modalities: Text, Duplex Voice/Audio, ShortConv Vision/Video &amp; Image/Video Gen</div>
            <div class="clover-model-option__speed">CPU Stage: ~3.5s 24-Layer C / ~6.0s NCM</div>
            <div class="clover-model-option__speed">CPU Response: ~15&ndash;35s Full Turn</div>
          </button>
          <button type="button" class="clover-model-option" role="option" aria-selected="false" data-model-key="kimi-k3" onclick="k3OnModelChanged('kimi-k3')">
            <div class="clover-model-option__head">
              <span>Kimi K3 2.78T MoE</span>
              <span class="clover-model-option__badge">Deep</span>
            </div>
            <div class="clover-model-option__meta">93-Layer 2.78T MoE &bull; 163.8K Vocab</div>
            <div class="clover-model-option__meta">Context: 1M Session (256K Native)</div>
            <div class="clover-model-option__meta">Modalities: Text, MoonViT3d Vision/Video, Voice &amp; Image Gen</div>
            <div class="clover-model-option__speed">CPU Stage: ~9.1s Stage (~4.4s on GPU)</div>
            <div class="clover-model-option__speed">CPU Response: ~60&ndash;140s Full Turn</div>
          </button>
        </div>
      </div>
    </div>
    <div class="clover-sidebar__label-row">
      <span class="clover-sidebar__label-text">Sessions</span>
      <button type="button" class="clover-sessions-plus-btn" id="k3-new-sess-btn" onclick="k3ResetChat()" title="Start a new session" aria-label="Start a new session">+</button>
    </div>
    <div class="clover-session-list" id="k3-session-list"></div>
  </aside>

  <section class="clover-main" aria-label="Clover conversation">
    <div class="clover-topbar">
      <div class="clover-topbar__left">
        <button type="button" class="clover-sidebar-toggle" id="clover-sidebar-toggle" onclick="k3ToggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <a class="clover-topbar__brand k3-chat-title" href="../" style="text-decoration:none" title="Clover Framework">
          <svg class="clover clover--brand" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <path class="clover__stem" d="M50 48C50 68 50 80 50 95"/>
            <use class="clover__leaf is-filled" href="#clover-leaf"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(72 50 44)"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(144 50 44)"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(216 50 44)"/>
            <use class="clover__leaf is-filled" href="#clover-leaf" transform="rotate(288 50 44)"/>
          </svg>
          Clover
        </a>
      </div>
      <div class="clover-topbar__right">
        <span class="clover-cpu-pill" id="clover-cpu-pill" title="Clover is running on a CPU server, so responses take longer">CPU Server &middot; Slow Response</span>
      </div>
    </div>

    <div class="clover-stream" id="clover-stream-scroller">
      <div class="clover-stream__inner" id="k3-chat-log" aria-live="polite">
        <div class="k3-msg k3-msg--bot">
          <p>Hi I am Clover, How can I help you today?</p>
        </div>
      </div>
    </div>

    <div class="clover-composer-wrap">
      <div class="clover-composer-card">
        <div class="clover-modality-bar" id="clover-modality-bar" aria-label="Model multimodal capabilities">
          <div class="clover-modality-actions">
            <button type="button" class="clover-modality-pill" id="k3-mod-vision-btn" onclick="k3PickModalityFile('image/*,video/*')" title="Attach an image or video for visual/temporal analysis">
              <span>📷 Image / Video</span>
            </button>
            <button type="button" class="clover-modality-pill" id="k3-mod-audio-btn" onclick="k3PickModalityFile('audio/*,.wav,.mp3,.m4a,.ogg,.flac')" title="Attach an audio or voice recording">
              <span>🎵 Audio</span>
            </button>
            <button type="button" class="clover-modality-pill" id="k3-voice-conv-pill" onclick="k3ToggleVoiceConversation()" title="Toggle hands-free duplex voice conversation">
              <span id="k3-voice-conv-label">🎙️ Voice Chat: Off</span>
            </button>
            <button type="button" class="clover-modality-pill" id="k3-gen-image-pill" onclick="k3TriggerMediaPrompt('image')" title="Generate a 1280x720 HD image (PNG, JPG, WebP, BMP)">
              <span>🖼️ Create Image</span>
            </button>
            <button type="button" class="clover-modality-pill" id="k3-gen-video-pill" onclick="k3TriggerMediaPrompt('video')" title="Generate an HD video clip (MP4, WebM, GIF, WebP)">
              <span>🎬 Create Video</span>
            </button>
            <button type="button" class="clover-modality-pill" id="k3-gen-audio-pill" onclick="k3TriggerMediaPrompt('audio')" title="Synthesize neural voice &amp; audio (MP3, WAV, OGG, FLAC)">
              <span>🔊 Create Audio</span>
            </button>
          </div>
          <span class="clover-modality-status" id="clover-modality-status">C-RADIO Vision &bull; EVS Video &bull; Mamba-2 Voice</span>
        </div>
        <div class="k3-preview-bar" id="k3-img-preview-bar" hidden>
          <div class="k3-preview-bar__info">
            <img id="k3-img-preview-thumb" src="../assets/case-study-01-contentful-migration.svg" alt="Attachment preview" hidden>
            <span id="k3-img-preview-name">Attachment ready</span>
          </div>
          <button type="button" onclick="k3ClearAttachments()">Remove</button>
        </div>
        <div class="clover-composer-row">
          <input type="file" id="k3-file-input" multiple hidden onchange="k3OnFilesSelected(event)">
          <button type="button" class="clover-composer-btn" id="k3-attach-btn" onclick="document.getElementById('k3-file-input').click()" title="Attach files (images, video, audio, PDF, documents, text)" aria-label="Attach files">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <textarea id="k3-prompt-in" rows="1" placeholder="Message Clover..."></textarea>
          <button type="button" class="clover-composer-btn" id="k3-voice-btn" onclick="k3ToggleVoice()" title="Voice input" aria-label="Voice input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <button type="button" class="clover-send-btn" id="k3-send-btn" onclick="k3SendPrompt()" aria-label="Send">
            <svg class="clover-send-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <path class="clover-send-icon__stem" d="M50 48C50 68 50 80 50 95"/>
              <g class="clover-send-icon__wheel">
                <use class="clover-send-icon__leaf" href="#clover-leaf"/>
                <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(72 50 44)"/>
                <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(144 50 44)"/>
                <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(216 50 44)"/>
                <use class="clover-send-icon__leaf" href="#clover-leaf" transform="rotate(288 50 44)"/>
              </g>
            </svg>
            <span>Send</span>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

      });

      if (this.variable_prompt_input_element) {
        this.variable_prompt_input_element.addEventListener('keydown', function (variable_key_event) {
          if (variable_key_event.key === 'Enter' && !variable_key_event.shiftKey) {
            variable_key_event.preventDefault();
            variable_self_coordinator.function_send_user_prompt_and_render_outcome();
          }
        });
      }

      this.variable_attachment_and_speech_codec.function_on_voice_transcript_ready = function () {
        variable_self_coordinator.function_send_user_prompt_and_render_outcome();
      };

      // Expose HTML inline handler hooks delegating directly to the domain classes
      window.k3CloseMobileSidebar = function () {
        variable_self_coordinator.function_close_mobile_sidebar();
      };
      window.k3ToggleSidebar = function (variable_event) {
        variable_self_coordinator.function_toggle_sidebar_drawer(variable_event);
      };
      window.k3SelectSession = function (variable_session_id) {
        variable_self_coordinator.function_select_session_by_identifier(variable_session_id);
      };
      window.k3DeleteSession = function (variable_session_id) {
        variable_self_coordinator.function_delete_session_and_reset_backend(variable_session_id);
      };
      window.k3ResetChat = function () {
        variable_self_coordinator.function_start_or_reset_chat_session();
      };
      window.k3OnFilesSelected = function (variable_change_event) {
        var variable_files =
          variable_change_event && variable_change_event.target && variable_change_event.target.files
            ? variable_change_event.target.files
            : [];
        variable_self_coordinator.variable_attachment_and_speech_codec.function_ingest_selected_files(
          variable_files
        );
      };
      window.k3PickModalityFile = function (variable_accept_filter) {
        var variable_file_el = document.getElementById('k3-file-input');
        if (!variable_file_el) {
          return;
        }
        variable_file_el.setAttribute('accept', variable_accept_filter || '*/*');
        variable_file_el.click();
      };
      window.k3ToggleVoiceConversation = function () {
        var variable_codec = variable_self_coordinator.variable_attachment_and_speech_codec;
        variable_codec.flag_is_voice_conversation_mode_enabled =
          !variable_codec.flag_is_voice_conversation_mode_enabled;
        var variable_pill = document.getElementById('k3-voice-conv-pill');
        var variable_lbl = document.getElementById('k3-voice-conv-label');
        if (variable_pill) {
          variable_pill.classList.toggle(
            'is-active',
            variable_codec.flag_is_voice_conversation_mode_enabled
          );
        }
        if (variable_lbl) {
          variable_lbl.textContent = variable_codec.flag_is_voice_conversation_mode_enabled
            ? '🎙️ Voice Chat: On'
            : '🎙️ Voice Chat: Off';
        }
        if (
          variable_codec.flag_is_voice_conversation_mode_enabled &&
          !variable_codec.flag_is_listening_for_voice
        ) {
          variable_codec.function_toggle_voice_recognition();
        }
      };
      window.k3TriggerMediaPrompt = function (variable_media_kind) {
        var variable_input = variable_self_coordinator.variable_prompt_input_element;
        if (!variable_input) {
          return;
        }
        var variable_cur = (variable_input.value || '').trim();
        var variable_prefix =
          variable_media_kind === 'video'
            ? 'Generate a video of '
            : variable_media_kind === 'audio'
              ? 'Generate an audio recording saying '
              : 'Generate an image of ';
        if (!variable_cur) {
          variable_input.value =
            variable_media_kind === 'video'
              ? 'Generate a video of the cosmos and orbital wave propagation'
              : variable_media_kind === 'audio'
                ? 'Generate an audio clip saying Welcome to Clover Multimodal Studio'
                : 'Generate an image of the cosmos';
        } else if (!/^(?:generate|create|draw|render|make|animate|synthesize|record)\b/i.test(variable_cur)) {
          variable_input.value = variable_prefix + variable_cur;
        }
        variable_input.focus();
      };
      window.k3ClearAttachments = function () {
        variable_self_coordinator.variable_attachment_and_speech_codec.function_clear_all_attachments();
      };
      window.k3ClearImage = window.k3ClearAttachments;
      window.k3ToggleVoice = function () {
        variable_self_coordinator.variable_attachment_and_speech_codec.function_toggle_voice_recognition();
      };
      window.k3CopyCode = function (variable_button) {
        variable_self_coordinator.function_copy_code_block_to_clipboard(variable_button);
      };
      window.k3SpeakReply = function (variable_button) {
        return variable_self_coordinator.variable_attachment_and_speech_codec.function_speak_assistant_reply(
          variable_button,
          variable_self_coordinator.variable_active_backend_base_url,
          variable_self_coordinator.variable_selected_model_key
        );
      };
      window.k3CopyReply = function (variable_button) {
        variable_self_coordinator.function_copy_reply_to_clipboard(variable_button);
      };
      window.k3RegenerateLast = function () {
        variable_self_coordinator.function_regenerate_last_assistant_reply();
      };
      window.k3SendPrompt = function () {
        return variable_self_coordinator.function_send_user_prompt_and_render_outcome();
      };
      window.k3ToggleModelMenu = function (variable_event) {
        variable_self_coordinator.function_toggle_model_menu(variable_event);
      };
      window.k3OnModelChanged = function (variable_new_model_key) {
        variable_self_coordinator.function_select_foundation_model_key(variable_new_model_key);
      };

      var variable_saved_model_key = constant_default_model_key;
      try {
        var variable_stored_model = localStorage.getItem(constant_model_storage_key);
        if (variable_stored_model && constant_model_cpu_response_descriptions[variable_stored_model]) {
          variable_saved_model_key = variable_stored_model;
        }
      } catch (variable_ignored_error) {}
      this.function_select_foundation_model_key(variable_saved_model_key);

      this.variable_session_store.function_load_sessions_from_browser_storage();
      this.function_render_session_sidebar_list();
      this.function_render_active_session_messages();
      this.function_probe_healthy_backend_endpoint();
    }
  }

  var variable_studio_coordinator = new class_clover_interactive_studio_coordinator();
  variable_studio_coordinator.function_bind_events_and_initialize_studio();
})();
</script>
<script src="../website-interaction-controllers.js?v=4.1.2" defer></script>
</body>
