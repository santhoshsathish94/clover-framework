services:
  agent:
    build: ./agent
    networks:
      - sandbox
    # The root filesystem is read-only, so the only writable places are the ones named below.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - ./workspace/src:/workspace/src:rw
      # Existing verification controls are runtime read-only.
      - ./workspace/tests:/workspace/tests:ro

networks:
  # Nothing here needs the network once the image is built. Denying egress means a prompt-injected
  # Execution cannot post the workspace anywhere, and the image build is unaffected.
  sandbox:
    internal: true
